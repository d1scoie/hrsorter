[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrsorter"
version = "0.1.0"
description = "ქართულენოვანი HR PDF-ების ადგილობრივი ავტომატური გადამრჩევი (Windows)"
requires-python = ">=3.12"
dependencies = [
  "pypdf==6.21.3",
  "pypdfium2==5.14.0",
  "pillow==13.0.0",
  "numpy==2.5.4",
  "watchdog==6.0.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "jsonschema==4.26.0",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "pystray==0.19.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "reportlab==5.1.0"]
online = ["anthropic==2.3.0"]
build = ["pyinstaller==6.22.3", "pefile==2024.8.26"]

[project.scripts]
hrsorter = "hrsorter.cli:main"

[tool.setuptools.packages.find]
include = ["hrsorter*"]

[tool.setuptools.package-data]
hrsorter = ["schema/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running stress tests (500 pages / 500 files)"]
